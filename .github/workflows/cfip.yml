name: Cloudflare IP Auto Update

on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download cfst
        run: |
          curl -fSL --retry 3 --retry-delay 2 --max-time 180 \
            -o cfst.tar.gz \
            https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.3.5/cfst_linux_amd64.tar.gz
          tar -xzf cfst.tar.gz
          ls -la
          if [ ! -f cfst_linux_amd64/cfst ]; then
            echo "::error::cfst 二进制未找到，检查压缩包结构"
            find . -maxdepth 3 -name 'cfst*' -type f
            exit 1
          fi
          chmod +x cfst_linux_amd64/cfst
          ./cfst_linux_amd64/cfst -v | head -3 || true

      - name: Run speed test
        run: |
          ./cfst_linux_amd64/cfst -f ip.txt -tl 200 -t 300 -dn 5 -p 20 -o result.csv || true
          echo "--- raw result ---"
          if [ ! -f result.csv ]; then
            echo "::error::result.csv 未生成，测速失败"
            exit 1
          fi
          cat result.csv

      - name: Convert to JSON
        run: python3 convert.py

      - name: Commit result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.json
          if git diff --staged --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "chore: update cf ip $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
